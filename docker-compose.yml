services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mediaintel
      POSTGRES_USER: mediaintel
      POSTGRES_PASSWORD: mediaintel
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U mediaintel -d mediaintel
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mediaintel:mediaintel@db:5432/mediaintel
      ADMIN_API_KEY: change-this-admin-key
      FREE_SEARCH_LIMIT: 4
    ports:
    - 8000:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
    - ./backend/app:/app/app
    - ./data:/app/data
  frontend:
    image: nginx:alpine
    ports:
    - 3000:80
    volumes:
    - ./frontend:/usr/share/nginx/html:ro
    depends_on:
    - backend
volumes:
  postgres_data: null
